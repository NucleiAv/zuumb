{% extends "auth_base.html" %}
{% block title %}Sign in{% endblock %}
{% block body %}
<div class="card">
  <h1>Sign in</h1>
  <p class="sub">zuumb dashboard</p>
  {% if bad %}<p class="err">Wrong username or password.</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="u">Username</label>
    <input id="u" type="text" name="username" autocomplete="username" value="admin">
    <label for="p">Password</label>
    <input id="p" type="password" name="password" autocomplete="current-password" autofocus>
    <button class="primary" type="submit">Sign in</button>
  </form>
</div>
<p class="foot"><a href="/login/help">Forgot password?</a></p>
{% endblock %}

{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block breadcrumb %}<span class="here">Sign in</span>{% endblock %}
{% block body %}
<h1>Sign in</h1>
{% if bad %}<p class="subtle" style="color:var(--sev-high)">Wrong username or password.</p>{% endif %}
<form method="post" action="/login" style="display:grid;gap:.6rem;max-width:280px;margin-top:1rem">
  <input type="hidden" name="next" value="{{ next }}">
  <input type="text" name="username" placeholder="username" autocomplete="username" value="admin">
  <input type="password" name="password" placeholder="password" autocomplete="current-password" autofocus>
  <button class="btn-approve" type="submit">Sign in</button>
</form>
{% endblock %}

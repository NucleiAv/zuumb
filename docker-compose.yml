# zuumb — end-user stack. Pulls the published image; no local build.
#
#   cp .env.example .env      # fill in ANTHROPIC_API_KEY + the WAZUH_* creds
#   docker compose up -d
#   open http://localhost:8000
#
# Wazuh is NOT run here — zuumb reads an EXISTING Wazuh stack. In .env point the
# WAZUH_*_API_URL values at `host.docker.internal` (not `localhost`) so the
# container can reach Wazuh running on the host.
#
# Optional Postgres instead of the bundled SQLite:  docker compose --profile pg up -d
# then set  DATABASE_URL=postgresql://zuumb:zuumb@postgres:5432/zuumb  in .env

name: zuumb

services:
  zuumb:
    image: ghcr.io/nucleiav/zuumb:latest
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - zuumb-data:/data          # the SQLite db lives here (DATABASE_URL default)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # D1 auth-log anomaly detector — polls the Wazuh alerts index every 10 min,
  # scores per-host auth-log windows, and ingests any anomaly as a rule.id 900001
  # alert through the same path Wazuh alerts use. Its own process, sharing only
  # the SQLite volume — statistical scoring must never block the dashboard.
  # (The D2 network-beacon detector stays a CLI tool: it needs a real flow feed
  # — Zeek/Suricata conn.log or nfstream — which this stack does not provide.)
  detector-authlog:
    image: ghcr.io/nucleiav/zuumb:latest
    env_file: .env
    command: ["python", "-m", "detectors.authlog.run", "--live", "--interval", "600"]
    volumes:
      - zuumb-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - zuumb
    healthcheck:
      disable: true
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    profiles: ["pg"]
    environment:
      POSTGRES_USER: zuumb
      POSTGRES_PASSWORD: zuumb
      POSTGRES_DB: zuumb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  zuumb-data:
  postgres-data:
